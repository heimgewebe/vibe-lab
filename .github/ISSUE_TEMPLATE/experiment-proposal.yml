# triggered_by: Bureau task OPERATOR-ECOSYSTEM-REDUNDANCY-V1-T005
name: "🧪 Experiment Proposal"
description: "Strukturiertes Experiment zur Prüfung einer Hypothese beantragen"
title: "[Experiment]: "
labels: ["experiment", "intake"]
body:
  - type: markdown
    attributes:
      value: |
        ## Experiment-Vorschlag
        Beschreibe ein strukturiertes Experiment zur Prüfung einer Hypothese.
        Das Experiment wird nach dem Golden Skeleton in `experiments/_template/` angelegt.

  - type: input
    id: related_idea
    attributes:
      label: "Bezug zu Idee (Issue-Nr.)"
      description: "Referenz auf ein bestehendes Idea-Issue, falls vorhanden."
      placeholder: "#42"
    validations:
      required: false

  - type: textarea
    id: hypothesis
    attributes:
      label: "Hypothese"
      description: "Welche konkrete, prüfbare Hypothese soll getestet werden?"
      placeholder: "Spec-First-Prompting reduziert die Fehlerquote bei API-Generierung um >30%."
    validations:
      required: true

  - type: textarea
    id: method
    attributes:
      label: "Methode (Kurzfassung)"
      description: "Wie soll die Hypothese geprüft werden? (Vollständige Methode im Experiment-Ordner)"
      placeholder: "3 identische Tasks mit/ohne Spec-First, Vergleich der Ergebnisse."
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: "Kontext / Setup"
      description: "Welche Tools, Modelle, Sprachen und Umgebungen werden verwendet?"
      placeholder: "GPT-4o, TypeScript, VS Code + Copilot, REST-API-Projekt"
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: "Kategorie"
      options:
        - Style
        - Technology
        - Technique
        - Workflow
        - Combo
    validations:
      required: true

  - type: textarea
    id: success_criteria
    attributes:
      label: "Erfolgskriterien"
      description: "Welche primäre Metrik, Einheit, Richtung sowie inklusiven numerischen Erfolgs- und Schadens-/Falsifikationsschwellen gelten?"
      placeholder: "review_defect_rate (percent, lower_is_better): success_threshold 5; harm_or_falsification_threshold 8."
    validations:
      required: true

  - type: checkboxes
    id: contribution_type
    attributes:
      label: "Beitragstyp"
      description: "Bestätigung des Contribution Contract"
      options:
        - label: "Dies ist ein **Experiment**-Beitrag gemäß dem Contribution Contract."
          required: true

  - type: input
    id: consumer
    attributes:
      label: "Downstream-Consumer"
      description: "Welches externe Organ oder Team wird das Ergebnis aktuell für welche konkrete Entscheidung nutzen?"
      placeholder: "Grabowski — Review der PR-Review-Strategie"
    validations:
      required: true

  - type: input
    id: consumer_commitment
    attributes:
      label: "Consumer-Commitment"
      description: "Namespaced externe Referenz auf die bestätigte Nutzung und Gültigkeit bis mindestens zum Experimentablauf."
      placeholder: "bureau:OPERATOR-TASK-ID — bestätigt bis 2026-09-01"
    validations:
      required: true

  - type: textarea
    id: decision_target
    attributes:
      label: "Entscheidungsziel und Owner"
      description: "Welche konkrete reviewed Entscheidung wird informiert, wer besitzt sie und welche namespaced externe Decision-Referenz identifiziert sie?"
    validations:
      required: true

  - type: textarea
    id: falsification_criteria
    attributes:
      label: "Falsifikationskriterium"
      description: "Welche messbare Beobachtung widerlegt oder stoppt die Hypothese?"
    validations:
      required: true

  - type: input
    id: expiry
    attributes:
      label: "Review- und Ablaufdatum"
      description: "Bis wann wird entschieden; wann wird das Experiment spätestens archiviert?"
      placeholder: "Review 2026-08-15; Ablauf 2026-09-01"
    validations:
      required: true

  - type: textarea
    id: surface_budget
    attributes:
      label: "Durable-Surface-Budget"
      description: "Welche dauerhafte Oberfläche wird hinzugefügt und welche mindestens gleich große Fläche wird entfernt, ersetzt oder stillgelegt? Bei Nettokosten: Reviewer, Zeitpunkt, externe Review-Referenz und Begründung."
      placeholder: "add:schemas/example.json; retire:scripts/legacy_example.py — oder reviewed exception bureau:TASK-ID"
    validations:
      required: true

  - type: checkboxes
    id: authority_boundary
    attributes:
      label: "Autoritätsgrenze"
      options:
        - label: "Das Experiment darf Policy, Routing, Queue, Merge oder Runtime nicht automatisch verändern."
          required: true
