name: Bundle Freshness Receipt

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  bundle-freshness-receipt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test bundle freshness receipt validator
        run: python3 scripts/docmeta/test_validate_bundle_freshness_receipt.py
