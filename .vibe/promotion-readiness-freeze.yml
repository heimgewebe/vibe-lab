      reason: >-
        Structured falsifiability block present, but counter-hypothesis
        assessments are not yet completed (pending checks outstanding).
        Frozen at two concrete signals, not a broad blanket exception.

    - path: experiments/2026-04-19_generated-artifact-contract-validation
      allowed_missing:
        - falsifiability
      reason: >-
        Executed in Phase 1 before falsifiability was mandatory. Pending
