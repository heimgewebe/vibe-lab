    - path: experiments/2026-04-23_phase-1-drift-injection
      allowed_missing:
        - falsifiability
      reason: >-
        Executed in Phase 1 before falsifiability was mandatory. Pending
        structured retrofit; frozen to avoid retroactive hard-fail.

    - path: experiments/2026-04-23_agent-failure-surface
      allowed_missing:
        - falsifiability.assessment_counterhypothesis_supported
      reason: >-
        Multi-phase experiment in progress (Phases 4-5 not yet executed).
        Phase 3 counter hypothesis ("existing chain validators already cover
        transition failures") was confirmed in the tested scope (Toleranz-Rate
        0/7). This is a legitimate bounded finding, not a flaw. Frozen at this
        specific signal to allow series completion; must be resolved before
        adoption_assessment.

    - path: experiments/2026-05-01_agent-skill-minimal-layer-instrumentation
      allowed_missing:
        - insufficient_proof_assessment
      reason: >-
        Run 1 (PR #145) captured with execution_status=executed. decision.yml
        carries verdict=insufficient_proof (execution_assessment, single measurement,
        no comparison group). Falsifiability block present with partially_checked/
        inconclusive assessment (one PR, not yet sufficient evidence for confirmation).
        Remove insufficient_proof_assessment once decision.yml verdict reflects
        sufficient evidence after at least three comparable PRs.

    - path: experiments/2026-07-05_ecosystem-organ-preflight
      allowed_missing:
        - falsifiability.assessment_not_checked
      review_date: "2026-09-01"
      reason: >-
        First executed instrumentation run captured (results/runs/run-001.yml,
        artifacts/run-001-pr292-execution-slice/). The two counter-hypotheses
        (complexity_selection, attention_effect) remain assessment.status=pending
        / outcome=not_checked because they cannot be checked at n=1 — they require
        multiple comparable ecosystem tasks with a coded baseline. This run is a
        usability/instrumentation record, not an efficacy claim. Remove this entry
        once the counter-hypotheses reach checked/partially_checked with evidence
        after enough comparable runs.

    - path: experiments/2026-07-23_operator-routing-ml-readiness-shadow
      allowed_missing:
        - insufficient_proof_assessment
      review_date: "2026-08-15"
      reason: >-
        The first real production cohort audit is executed and evidence-bound,
        but the cohort contains only one eligible production case, one explicit
        semantic abstention and zero complete independently reviewed cases. The
        preregistered minimum is twenty natural production cases with at least
        90 percent route-plus-reviewed-outcome completeness. Keep promotion
        blocked and remove this exact freeze entry only after a separately
        reviewed readiness PASS or experiment closure.

    - path: experiments/2026-08-16_outcome-bound-operator-loop-p0
      allowed_missing:
        - falsifiability.assessment_not_checked
        - falsifiability.assessment_pending_blocking
      review_date: "2026-09-15"
      reason: >-
        P1 terminated early under its frozen prospective-cohort stop rule after
        P1-02 was independently found ineligible because productive mutation had
        already begun before Stage A. The current execution assessment is terminal
        rather than insufficient-proof, so that signal has been removed from this
        freeze. The two remaining exact signals are still real: one registered
        counter-hypothesis was never checked and another remains partially checked
        with a pending comparison that the early-stopped P1 did not authorize.
        Keep only these bounded falsifiability blockers; do not treat early-stop
        execution as efficacy, adoption evidence, or P3 authorization.

    - path: experiments/2026-08-16_outcome-bound-operator-loop-successor-s0
      allowed_missing:
        - falsifiability.assessment_counterhypothesis_supported
      reason: >-
        S0 executed its preregistered independent semantic review and was
        terminally rejected: Reviewer B found two material disagreements,
        including a supported counter-hypothesis that the intervention boundary
        remains ambiguous. Promotion readiness must therefore stay fail-closed at
        this exact signal. This freeze records the rejected result; it is not an
        exception authorizing S1, a validator, P2/P3, adoption, or production
        integration. Remove only if a separately authorized successor experiment
        supersedes this experiment's readiness role; do not rewrite the rejected
        S0 result.

    - path: experiments/2026-08-16_outcome-bound-operator-loop-successor-s0r2
      allowed_missing:
        - falsifiability.assessment_blocked
        - falsifiability.assessment_counterhypothesis_supported
      reason: >-
        S0-R2 was terminally rejected after the exact-head PR review found that
        its effect-lineage rule still leaves the precondition-versus-material-
        sub-effect boundary ambiguous on R2-02/R2-08. A separate registered
        comparison/procedure mismatch prevents repairing the frozen revision in
        place, and the early semantic stop leaves the metadata-overhead
        counter-hypothesis deliberately unmeasured. These two exact readiness
        blockers therefore describe the negative result rather than an unfinished
        promotion candidate. The freeze authorizes no S1, natural cohort,
        validator, P2/P3, adoption or production integration; remove only if a
        separately authorized successor supersedes this experiment's readiness
        role, never by rewriting the rejected R2 result.

    - path: experiments/2026-08-17_outcome-bound-operator-loop-successor-s1-natural-shadow
      allowed_missing:
        - falsifiability.assessment_counterhypothesis_supported
      reason: >-
        S1 is terminally rejected because its frozen natural-sampling protocol does
        not uniquely determine whether post-activation supersession events for a
        pre-existing candidate identity are separate treatment arrivals. Independent
        exact-head review confirmed that a later identity-first obligation cannot
        retroactively resolve the already observed sample. The supported
        counter-hypothesis is therefore the negative result itself, and promotion
        readiness must remain fail-closed at exactly this signal. This freeze
        authorizes no replacement cohort, P1/P2/P3, Minimal-versus-Full comparison,
        adoption, routing, runtime or other production integration; remove only if a
        separately authorized successor supersedes S1's readiness role, never by
        rewriting the rejected evidence.

    - path: experiments/2026-08-18_outcome-bound-operator-loop-successor-s1r1-natural-identity-shadow
      allowed_missing:
        - falsifiability.assessment_blocked
        - falsifiability.assessment_counterhypothesis_supported
      reason: >-
        S1-R1 is terminally rejected before natural activation. Exact-head review
        found that natural-source independence was not frozen, allowing manufactured
        post-activation candidates to satisfy the formal gate. A separate canonical
        Bureau StateStore/runtime readback found that legacy candidate events without
        stored candidate_id are normalized to candidate-event-<event_id>, while the
        frozen S1-R1 rule groups only events containing the explicit ID and can hide
        the true legacy identity root. The supported counter-hypothesis and the
        deliberately blocked natural-informativeness assessment therefore encode the
        negative result, not an unfinished promotion candidate. This freeze
        authorizes no replacement cohort, validator, P2/P3, Minimal-versus-Full,
        adoption, routing, runtime or production integration; remove only if a
        separately authorized successor supersedes S1-R1's readiness role, never by
        rewriting the rejected method or registration.

    - path: experiments/2026-08-20_outcome-bound-operator-loop-successor-s1r2-natural-activation
      allowed_missing:
        - falsifiability.assessment_blocked
      reason: >-
        S1-R2-Natural is terminally rejected before activation because current-head
        review found a material pre-arming selection window: a controller with advance
        knowledge of an independently planned Operator-Intake arrival could still time
        finalization, checkpoint arming or merge so the arrival falls below or above
        the eventual activation watermark and thereby changes S1R2-N01..N03. The
        blocked live-source/capture/informativeness counter-hypotheses remain deliberately
        unmeasured because no natural cohort was activated. This exact freeze preserves
        the negative result rather than rewriting blocked assessments as checked. It
        authorizes no replacement cohort, checkpoint, P2/P3, Minimal-versus-Full,
        adoption, routing, runtime or production integration; remove only if a separately
        registered successor supersedes this readiness role, never by rewriting the
        rejected evidence.

    - path: experiments/2026-08-20_outcome-bound-natural-pilot-sampling-unit
      allowed_missing:
        - falsifiability.assessment_counterhypothesis_supported
      reason: >-
        T035 sampling-unit revision 1 is terminally rejected after exact-head Codex
        review found a material zero-versus-one fixed-slot ambiguity between the
        frozen self-interference inclusion rule and the fixed-ordinal consumption
        rule. The later review also exposed that two favorable assessment labels
        existed before their referenced counter-check evidence. The supported
        single-reviewer-blind-spot counter-hypothesis is therefore part of the
        negative result itself. This exact freeze preserves the rejected prospective
        revision without rewriting its frozen method or U01-U09 cases and authorizes
        no natural pilot, validator, routing, runtime, P2/P3 or production integration.
        Remove only if a separately registered successor supersedes this experiment's
        readiness role; never by converting the rejected evidence into a pass.
    - path: experiments/2026-08-22_outcome-bound-natural-pilot-sampling-unit-r2
      allowed_missing:
        - falsifiability.assessment_counterhypothesis_supported
        - falsifiability.assessment_not_checked
      reason: >-
        T036 sampling-unit R2 is terminally rejected after exact-head Codex review
        found a direct zero-versus-one contradiction in the frozen one-slot rule.
        The first required attack is therefore material and sufficient under the
        preregistered fail-closed threshold. Remaining attacks are deliberately left
        not_checked rather than retroactively claimed after terminal falsification,
        while the supported erase-the-slot counter-hypothesis remains part of the
        negative result. This exact freeze preserves the rejected prospective revision
        without rewriting method.md, registration.v2.json or R01-R09 and authorizes no
        natural pilot or production integration. Remove only if a separately registered
        successor supersedes this readiness role; never by converting the rejected
        evidence into a pass.

    - path: experiments/2026-08-24_outcome-bound-natural-pilot-sampling-unit-r3
      allowed_missing:
        - falsifiability.assessment_not_checked
      reason: >-
        T037 R3 v1 is terminally rejected. The frozen author revision deliberately
        retains all preregistered counter-hypothesis assessments as pending/not_checked;
        the later exact-head result and review evidence record the rejection separately.
        This exact freeze prevents that preserved prospective state from being mistaken
        for unfinished promotion work and authorizes no natural pilot, adoption, routing,
        runtime or production integration. Remove only if a separately reviewed successor
        makes this readiness role obsolete; never by rewriting the frozen author assessment.

    - path: experiments/2026-08-24_outcome-bound-natural-pilot-sampling-unit-r3-v2
      allowed_missing:
        - falsifiability.assessment_not_checked
      reason: >-
        T037 R3 v2 is terminally rejected despite a semantic review pass because the exact
        frozen revision failed the repository clean-fixpoint requirement. Its preregistered
        assessments remain pending/not_checked at the frozen author revision while the
        reviewer/controller disagreement and terminal rejection are preserved in separate
        result evidence. This exact freeze records that negative lifecycle state and grants
        no pilot, adoption, routing, runtime, merge or production authority.

    - path: experiments/2026-08-24_outcome-bound-natural-pilot-sampling-unit-r3-v3
      allowed_missing:
        - falsifiability.assessment_not_checked
      review_date: "2026-09-30"
      reason: >-
        T037 R3 v3 completed the paper/adversarial exact-head qualification and independent
        review successfully, but the frozen author manifest intentionally preserves all nine
        preregistered assessments as pending/not_checked; post-review verdicts live in the
        separate result and receipt surfaces. The experiment remains testing rather than
        adopted and explicitly authorizes no Natural Pilot or productive integration. Freeze
        only this exact readiness signal so the ratchet remains fail-closed without mutating
        prospective author metadata after review. Remove only through a separately reviewed
        lifecycle decision, not by backfilling favorable labels into the frozen author state.
