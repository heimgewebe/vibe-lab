  - path: "experiments/2026-04-23_agent-failure-surface/artifacts/run-phase-f-rrg02-real/observed.json"
    role: "Fixture-Beleg RRG-02: git_state_drifted (HEAD/Index/WT-Divergenz)"
  - path: "experiments/2026-04-23_agent-failure-surface/artifacts/run-phase-f-rrg03-real/observed.json"
