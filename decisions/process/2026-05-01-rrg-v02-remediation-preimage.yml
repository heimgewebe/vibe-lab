title: "RRG-v0.2 Remediation Preimage — Getrennte Drift-Klassen und Hypothesen (Diagnose-only)"

rationale: |
  Alle drei RRG-Klassen sind seit 2026-05-01 fixture-proven:
  - RRG-01: content_drifted durch CRLF→LF-Normalisierung im Apply-Layer.
  - RRG-02: git_state_drifted durch HEAD/Index/Working-Tree-Divergenz nach
    staged + unstaged Mutation.
  - RRG-03: locator drifted durch Removal-Drift (Run 01) und
    Injection-Before-Drift (Run 02).

  Die Strategie-Diagnose (rrg03-remediation-strategy-comparison.md) und
  die Cross-Diagnosis (replay-gap-cross-diagnosis-rrg01-rrg02.md) haben
  gezeigt, dass die drei Drift-Klassen strukturell getrennt sind und
  unterschiedliche Remediation-Pfade benötigen.

  Dieses Decision Preimage hält die belegten Drift-Klassen, die daraus
  abgeleiteten Remediation-Hypothesen und die Breaking-Change-Grenzen
  fest — ohne Schema-, Validator-, Runtime- oder CI-Änderung. Es ist
  Entscheidungsvorstufe, kein Entscheid, kein Patch, kein accepted-Status.

