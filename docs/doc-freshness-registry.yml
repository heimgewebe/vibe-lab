kind: lenskit.doc_freshness_registry
version: "1.0"
authority: diagnostic_signal
risk_class: diagnostic
does_not_prove:
  - "registered claims are true beyond their declared evidence"
  - "documentation is complete"
  - "an agent understood the repository"
  - "a generated claim-evidence map has already been emitted"
entries:
  - id: operator-lab-loop-playbook-active
    doc: docs/playbooks/operator-lab-loop.md
    locator: "frontmatter.status"
    claim: "The Operator Lab Loop playbook remains an operative method anchor."
    status: historical
    normative: false
    owner: heimgewebe
    last_verified: "2026-07-13"
    evidence:
      - kind: text
        target: "docs/playbooks/operator-lab-loop.md::status: active"
        implies: done
      - kind: text
        target: "docs/playbooks/operator-lab-loop.md::canonicality: operative"
        implies: done
    notes: "The playbook remains readable as a historical method anchor; the 36-card series is frozen and this entry does not reactivate it or claim usefulness."

  - id: operator-lab-anchor-run-present
    doc: experiments/2026-07-01_operator-lab-loop/manifest.yml
    locator: "experiment.execution_refs"
    claim: "The first Operator Lab Loop anchor run remains recorded with a run card."
    status: historical
    normative: false
    owner: heimgewebe
    last_verified: "2026-07-13"
    evidence:
      - kind: file
        target: experiments/2026-07-01_operator-lab-loop/artifacts/run-001-plan-anchor/run-card.yml
      - kind: text
        target: "experiments/2026-07-01_operator-lab-loop/manifest.yml::artifacts/run-001-plan-anchor/run-card.yml"
        implies: done
    notes: "Historical provenance only. Run 001 and the frozen series do not prove operator-loop usefulness."

  - id: roadmap-survivor-program-visible
    doc: docs/roadmap.md
    locator: "RL-002 — Legacy-Validator-Survivor-Audit"
    claim: "The roadmap exposes the bounded truth-alignment and legacy-survivor work without acting as active experiment truth."
    status: done
    normative: false
    owner: heimgewebe
    last_verified: "2026-07-13"
    evidence:
      - kind: text
        target: "docs/roadmap.md::## Aktiver Repository-Ball"
        implies: done
      - kind: text
        target: "docs/roadmap.md::### RL-002 — Legacy-Validator-Survivor-Audit"
        implies: done
    notes: "Roadmap visibility is navigation only; active experiment truth remains experiments/active.v1.json and task decisions remain in Bureau."

  - id: agent-reading-protocol-active
    doc: docs/policies/agent-reading-protocol.md
    locator: "frontmatter.status"
    claim: "Agent reading requirements are documented as an active task-profile protocol."
    status: done
    normative: true
    owner: heimgewebe
    last_verified: "2026-07-01"
    evidence:
      - kind: file
        target: docs/policies/agent-reading-protocol.md
      - kind: text
        target: "docs/policies/agent-reading-protocol.md::## 2. Task-Profile"
        implies: done
    notes: "This registers the protocol surface; it does not prove agents actually followed it."

  - id: pr-template-experiment-decision-surface
    doc: .github/pull_request_template.md
    locator: "Experiment / Entscheidungsfläche"
    claim: "The PR template asks authors to bind work to an active experiment or reviewed decision, or justify why that is not applicable."
    status: done
    normative: true
    owner: heimgewebe
    last_verified: "2026-07-13"
    evidence:
      - kind: text
        target: ".github/pull_request_template.md::Experiment / Decision Surface:"
        implies: done
      - kind: text
        target: ".github/pull_request_template.md::Verbraucher / Entscheidungsziel:"
        implies: done
    notes: "A template prompt does not prove that supplied experiment, consumer or decision references are correct."
