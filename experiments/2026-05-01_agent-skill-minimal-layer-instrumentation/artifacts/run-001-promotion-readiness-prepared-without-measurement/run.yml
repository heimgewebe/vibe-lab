# Run-001 Bundle Envelope
# Schema: schemas/experiment-run-bundle.v1.schema.json
# Pfade in artifacts.* sind relativ zu diesem Verzeichnis (artifacts/<run-id>/).
# experiment_path ist repo-root-relativ.

schema_version: "1.0.0"
contract: "experiment_run_bundle"

run:
  id: "run-001-promotion-readiness-prepared-without-measurement"
  experiment_path: "experiments/2026-05-01_agent-skill-minimal-layer-instrumentation"
  created_at: "2026-05-01T12:37:30Z"
  sequence: 1

provenance:
  level: "self_reported"
  executor: "local:copilot-agent"
  source_status: "external_unverified"
  notes: "PR-Metadaten und CI-/make-Outputs sind nicht repo-lokal archiviert."

artifacts:
  auditor_output:
    path: "auditor-output.yml"
    contract: "auditor_output"
    canonical: true
  measurement:
    path: "measurement.yml"
    contract: "measurement_run"
    canonical: true
  run_meta:
    path: "run_meta.json"
    contract: "run_meta"
    canonical: false
    compatibility: true
  markdown_projection:
    path: "auditor-output.md"
    canonical: false
    role: "human_projection"
  evidence_pack:
    path: "evidence-pack.yml"
    contract: "run-evidence-pack.v1"
    canonical: true

verdict:
  outcome: "MISSING_EVIDENCE"
  effect_claim_allowed: false
  promotion_claim_allowed: false

interpretation_limits:
  min_comparable_runs_required: 3
  current_comparable_runs: 1
  causal_claim_allowed: false
