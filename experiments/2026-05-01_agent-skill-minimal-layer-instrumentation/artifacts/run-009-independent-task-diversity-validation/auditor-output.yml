    text: "Task scope is structurally outside the validator-test-hardening task cluster (run-005/006): multi-artifact scaffold synthesis with cross-run evidence, schema compliance across 6+ files, and epistemic calibration."
    type: "task_diversity_probe"
    verdict: "PASS"
