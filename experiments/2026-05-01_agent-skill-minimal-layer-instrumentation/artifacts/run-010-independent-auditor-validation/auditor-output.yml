  canonical_claim_source: "evidence-pack.yml (pack-001 through pack-007)"
  auditor_independence_status: "PARTIAL"
  auditor_independence_note: >
    This auditor-output.yml is produced by a different session from run-010.
    Run-010 executor: claude-code:claude-sonnet-4-6, session_011cvra3PDFriTmZTKsuCCVB.
    This auditor: claude-code:claude-sonnet-4-6, session_01WRxj2xvpB7Xgu4soTdJYE4.
    The session IDs are distinct. This auditor did NOT execute run-010 and had no
    prior in-session context of this experiment before being asked to audit it.
    The underlying model family (claude-sonnet-4-6) is the same; full independence
