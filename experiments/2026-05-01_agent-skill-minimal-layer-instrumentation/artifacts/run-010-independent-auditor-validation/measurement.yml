schema_version: "1.0.0"
contract: "measurement_run"
run_id: "run-010-independent-auditor-validation"

auditor_verdict: "PASS"
auditor_ref: "auditor-output.yml"

agent_layer_used:
  agent: "self_reported:claude-sonnet-4-6"
  executor: "claude-code"
  role: >
    Post-audit reconciliation of the run-010 execution evidence package.
    PASS is derived from external different-session auditor-output.yml for
    pack-001 through pack-007. auditor_independence_status is PARTIAL (same
    model family); full auditor independence remains not proven. This run still
    makes no usefulness, adoption, promotion, or causal claim.

metrics:
  scope_drift_count:
    value: 0
    evidence_status: "repo_local"
    notes: >
      Scope limited to run-010 artifact directory creation plus required
      bookkeeping updates (manifest.yml, evidence.jsonl, cross-run-assessment.md,
      decision.yml, roadmap.md). changed-files.txt archives the full list of
      touched paths.

  unsupported_claim_count:
    value: 0
    evidence_status: "derived_from_auditor_output"
    notes: >
      All externally audited package claims (pack-001 through pack-007) are PASS
      in auditor-output.yml. This metric counts non-PASS claims in the
      auditor-output.yml claim set only; it does not represent all remaining
      experiment-level blockers. The earlier unsupported independence gap is now
      tracked separately as missing_evidence item full_auditor_independence.

  missing_locator_count:
    value: 0
    evidence_status: "repo_local"
    notes: >
      All evidence references in evidence-pack.yml point to concrete repo-local
      artifacts within this run bundle. No dangling references.

  validation_gap_count:
    value: 0
    evidence_status: "repo_local"
    notes: >
      All command claims in evidence-pack.yml include concrete evidence paths.
      Full command output is archived in raw-command-log.txt. No summary-only
      claims without backing artifact.

  review_friction_count:
    value: null
    evidence_status: "missing_evidence"
    notes: >
      No PR review lifecycle has occurred for this run at artifact-creation
      time. No review-events.yml exists. Metric remains missing_evidence.

  rework_count:
    value: null
    evidence_status: "missing_evidence"
    notes: >
      No review-driven rework commits can be attributed to this run. Metric
      remains missing_evidence.

  false_block_count:
    value: 0
    evidence_status: "repo_local"
    notes: >
      No false blocking observed. The PASS verdict reflects the externally
      audited run-010 evidence package scope (pack-001 through pack-007).

  task_completion_time_observed:
    value: null
    evidence_status: "missing_evidence"
    notes: >
      Timing is captured in ci-or-git-timing.txt with explicit evidence_status
      self_reported. However, because no independently verifiable start/end
      signal exists (no CI job, no separate session log), the metric value is
      set to null / missing_evidence rather than upgrading a self-reported
      duration to an observation. See ci-or-git-timing.txt for what was captured
      and what upgrade path would be required.

missing_evidence:
  - item: "full_auditor_independence"
    detail: >
      Different-session audit exists, and auditor_independence_status is
      PARTIAL. Full auditor independence remains not proven under
      independent-auditor-proof.txt criteria because the same model family was
      used. Human reviewer or different AI system is still needed for full
      independence.
  - item: "review_friction_count"
    detail: "No PR review events exist for this run at artifact-creation time."
  - item: "rework_count"
    detail: "No review-events artifact or rework commit chain exists for this run."
  - item: "task_completion_time_observed"
    detail: >
      Self-reported timing only; no CI job duration, no independently captured
      session log. Cannot upgrade to repo_local or external_verified.

interpretation_limits:
  - "This run is an execution evidence package preparation run; it does not count as a comparable usefulness run."
  - "auditor-output.yml is externally audited PASS for pack-001 through pack-007; auditor_independence_status is PARTIAL and full auditor independence remains not proven."
  - "review_friction_count and rework_count remain missing_evidence."
  - "Timing is self_reported; not independently verified."
  - "This run does not produce a usefulness, adoption, promotion, or causal verdict."

extensions:
  auditor_independence_status: "PARTIAL"
  task_cluster: "independent-auditor-validation-preparation"
  run_purpose: "audit-ready-evidence-package"
  note_on_auditor_ref: >
    auditor-output.yml was replaced by an external different-session auditor and
    is canonical for pack-001 through pack-007 package validation.
    auditor_independence_status is PARTIAL, and full independence remains not
    proven because executor and auditor still share the same model family.
