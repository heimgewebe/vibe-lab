schema_version: "1.0.0"
contract: "measurement_run"
run_id: "run-013-replicated-outcome-evidence"

auditor_verdict: "CLAIM_NOT_PROVEN"
auditor_ref: "auditor-output.yml"

agent_layer_used:
  agent: "self_reported:gpt-5.3-codex"
  executor: "copilot-coding-agent"
  role: >
    Execute a non-trivial documentation/contract-alignment task and capture
    review/rework/timing metrics in a schema-valid replicated outcome-evidence run
    without upgrading usefulness/adoption/promotion claims.

metrics:
  scope_drift_count:
    value: 0
    evidence_status: "repo_local"
    notes: >
      Full PR file scope is archived in changed-files.txt.
      The semantic task target subset is archived in task-target-files.txt.

  unsupported_claim_count:
    value: 2
    evidence_status: "derived_from_auditor_output"
    notes: "Two auditor claims remain non-PASS and preserve CLAIM_NOT_PROVEN discipline."

  missing_locator_count:
    value: 0
    evidence_status: "repo_local"
    notes: "All evidence paths are repo-relative and resolvable."

  validation_gap_count:
    value: 0
    evidence_status: "derived_from_auditor_output"
    notes: "No validator/command-success claims are marked MISSING_EVIDENCE."

  review_friction_count:
    value: null
    evidence_status: "missing_evidence"
    notes: >
      review-source.md proves review_event_count=1 in the capture window,
      but COMMENTED state plus generic review body is insufficient to classify
      review_friction_count under the strict rule.
    extensions:
      review_event_count_observed: 1

  rework_count:
    value: null
    evidence_status: "missing_evidence"
    notes: >
      commit-source.md proves revision_commit_count=4, but review-driven rework is
      not established because captured commits are not post-review and not explicitly
      linked to review feedback.
    extensions:
      revision_commit_count_observed: 4

  false_block_count:
    value: 0
    evidence_status: "repo_local"
    notes: "No false validator block observed during run-013 artifact production."

  task_completion_time_observed:
    value: 2100
    evidence_status: "repo_local"
    notes: >
      Captured from timing.txt as a run-local manual timing snapshot.

interpretation_limits:
  - "Validator-green is integrity evidence only, not outcome proof."
  - "This run does not close RM-002 or RM-005."
  - "review_event_count and revision_commit_count are observable, but review_friction_count and rework_count remain interpretation-limited."
  - "review-events.yml keeps integer-only capture-window classifications (0/0) due to contract constraints; canonical outcome interpretation is this measurement file (null/missing_evidence for review_friction_count and rework_count)."

missing_evidence:
  - item: "review_friction_count"
    detail: "Captured evidence proves review_event_count=1, but not friction classification."
  - item: "rework_count"
    detail: "Captured evidence proves revision_commit_count=4, but not review-driven rework linkage."

extensions:
  task_class: "documentation_contract_alignment"
  task_cluster_distinct_from:
    - "validator-test-hardening"
    - "multi-artifact-scaffold-synthesis"
