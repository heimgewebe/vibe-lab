  created: "2026-05-01"
  updated: "2026-05-12"
  author: "copilot-agent"
  iteration: 9
  evidence_level: anecdotal
  falsifiability:
    version: 1
    falsification_criterion: >-
      Die Hypothese gilt als geschwächt, wenn nach mindestens drei vergleichbaren PRs
      die Run-Artefakte unvollständig sind, Metriken nicht konsistent ableitbar sind,
      oder Agent- und Auditor-Nutzung nicht belegbar archiviert werden kann.
      Kein Wirksamkeitsclaim: Das Kriterium betrifft ausschließlich die Messbarkeit
      des Scaffolds, nicht die Wirkung der Agent/Skill-Schicht.
    counter_hypotheses:
      - id: scaffold_not_comparable_across_prs
        statement: >-
          Das Messgerüst erfasst keine vergleichbaren PR-Daten, weil
          PR-Kontext, Metriken oder Run-Bundles zwischen PRs zu stark variieren,
          um epistemisch sinnvolle Vergleiche zu ermöglichen.
        assessment:
          status: partially_checked
          outcome: inconclusive
          evidence_refs:
            - path: experiments/2026-05-01_agent-skill-minimal-layer-instrumentation/artifacts/run-001-promotion-readiness-prepared-without-measurement/measurement.yml
              section: "Run 1 — single PR measurement"
            - path: experiments/2026-05-01_agent-skill-minimal-layer-instrumentation/artifacts/run-009-independent-task-diversity-validation/comparability.yml
              section: "Run 9 — task-diversity probe outside validator-test-hardening cluster"

