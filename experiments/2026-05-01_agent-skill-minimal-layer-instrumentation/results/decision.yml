rationale: |
  Formale Mindestschwelle für eine Cross-Run-Auswertung erreicht: drei als vergleichbar
  dokumentierte kontrollierte Runs (run-002, run-005, run-006). Diese Schwelle erlaubt
  nur eine strukturierte Auswertung des Messgerüsts, keine Promotion-, Wirkungs- oder
  Nutzenaussage. Cross-Run-Assessment liegt in results/cross-run-assessment.md vor.
  Verdict bleibt insufficient_proof — jetzt aus präziseren Gründen:
  Scaffold-Artefaktstruktur ist reproduzierbar (5/8 Metriken konsistent erfasst),
  aber review_friction_count, rework_count und task_completion_time_observed sind
  in allen drei vergleichbaren Runs persistently null oder self_reported. Diese
  drei Metriken sind die einzigen, die Ausführungsqualität sichtbar machen könnten.
  Ohne sie ist die Scaffold-Hypothese ("can capture comparable PR-level data") nur
  partiell belegt. Zusätzlich: runs 005/006 aus derselben Task-Klasse (task-Cluster,
  keine echte Varietät), Auditor-Executor == Executor in allen Runs (keine
  unabhängige Bewertung), keine negativen Fälle dokumentiert.
  Run-007 hat review_friction_count und rework_count als repo_local pilotiert.
  Run-008 hat einen Negativfall / CLAIM_NOT_PROVEN pilotiert (partielle Unabhängigkeit).
  Run-009 hat Task-Diversität partiell adressiert: claim-002 PASS (Task außerhalb
  validator-test-hardening-Cluster), claim-003 CLAIM_NOT_PROVEN (Auditor-Unabhängigkeit
  bleibt partial). Timing-Semantik verbessert: self_reported mit explizitem
  capture_mode und validation_path.
  Kein Upgrade auf result_assessment zulässig.

