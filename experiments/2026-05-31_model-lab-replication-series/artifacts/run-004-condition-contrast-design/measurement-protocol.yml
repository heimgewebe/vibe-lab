# Run-004 — Shared Measurement Protocol (frozen design)
#
# Pre-declares the metrics and measurement rules applied identically to both arms in a
# later, separate run. Contains NO measured values and NO hypotheses-as-results. Metric
# selection is fixed before execution; post-hoc metric selection is forbidden. The
# treatment's process specification is part of the intervention and is not scored as an
# outcome advantage.
artifact_type: "model_lab_condition_design_measurement_protocol"
design_id: "run-004-condition-contrast"
series_id: "2026-05-31_model-lab-replication-series"
challenge_version: "rest-api-v1"

applies_equally_to_both_arms: true
post_hoc_metric_selection_forbidden: true
does_not_record_values: true
treatment_only_scoring_forbidden: true

primary_metrics:
  - id: "functional_test_pass_ratio"
    unit: "ratio"
    range: {minimum: 0, maximum: 1}
    formula: "passing_shared_functional_tests / total_shared_functional_tests"
  - id: "error_case_test_pass_ratio"
    unit: "ratio"
    range: {minimum: 0, maximum: 1}
    formula: "passing_shared_error_case_tests / total_shared_error_case_tests"
  - id: "forced_500_check_pass"
    unit: "boolean"
    formula: "1 if the shared forced-500 assertion passes else 0"
  - id: "workflow_protocol_compliance"
    unit: "categorical"
    formula: "assigned-protocol compliance verdict (compliant / non_compliant / contaminated); not a quality judgment"
  - id: "time_to_validated_change_seconds"
    unit: "seconds"
    formula: "timer_end - timer_start, where timer_end is when the shared verification first passes"

secondary_metrics:
  - id: "rework_steps"
    unit: "count"
    formula: "number of post-authoring revisions to fix defects in already-produced implementation"
  - id: "human_intervention_count"
    unit: "count"
    formula: "number of human-originated corrections beyond the shared task input"
  - id: "scope_drift_status"
    unit: "categorical"
    formula: "none / observed (challenge or acceptance surface changed by the arm)"

timing:
  timer_start: "When the agent first receives the shared task input."
  timer_end: "When the shared verification protocol first passes, or a stop rule fires."

definitions:
  workflow_protocol_compliance: >
    Whether the arm followed its ASSIGNED workflow instruction (treatment: complete spec
    before first implementation mutation; control: no specification requirement). A
    control arm that voluntarily produces a full prior specification is recorded as
    contaminated. This is a compliance verdict, not a quality or superiority judgment.

rules:
  scope_drift: >
    An arm that changes the challenge/acceptance surface is marked scope_drift and its
    metrics are not comparable; this does not retroactively change the other arm.
  aborted_arm: >
    An arm that hits a stop rule before the shared verification passes is recorded as
    aborted with the reason; incomplete metrics are reported as such, not imputed.
  missing_value: >
    A metric that cannot be computed is recorded as missing (null), never as zero or a
    guessed value.
