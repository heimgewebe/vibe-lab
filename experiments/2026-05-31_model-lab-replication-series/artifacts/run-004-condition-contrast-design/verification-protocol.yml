# Run-004 — Shared Verification Protocol (frozen design)
#
# Defines the verification SURFACE applied identically to both arms in a later, separate
# run. This DESCRIBES the shared verification; it does NOT execute it and contains no run
# verifier or implementation. The concrete executable harness is deferred to
# execution-readiness. Any arm-dependent verification invalidates the design.
artifact_type: "model_lab_condition_design_verification_protocol"
design_id: "run-004-condition-contrast"
series_id: "2026-05-31_model-lab-replication-series"
challenge_version: "rest-api-v1"

applies_equally_to_both_arms: true
per_arm_test_overrides_forbidden: true
does_not_execute: true
executable_harness_binding_status: "deferred_to_execution_readiness"

# Verification surface bound at design time (WHAT is checked, equally for both arms).
shared_verification_surface:
  functional_areas:
    - "all rest-api-v1 endpoints (POST/GET/PUT/DELETE/list)"
    - "input validation for every endpoint"
    - "consistent response envelope"
    - "pagination via page/limit"
  error_cases:
    - "validation failure (400/422)"
    - "not found (404)"
    - "conflict (409)"
  forced_500_check: "an induced internal error must yield the rest-api-v1 error envelope with HTTP 500, identically for both arms"
  pass_fail_semantics:
    pass: "all shared functional, error-case, and forced-500 checks succeed under the shared runtime"
    fail: "any shared check fails, or the runtime cannot be established"

# Concrete harness instance bound only at execution-readiness (HOW it is run).
deferred_to_execution_readiness:
  - concrete_test_files
  - executable_harness_version
  - install_command
  - start_command
  - exact_test_command
  - concrete_timeout_values

abort_on_arm_dependent_drift: true
