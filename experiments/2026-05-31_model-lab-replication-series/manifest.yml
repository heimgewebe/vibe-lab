schema_version: "0.1.0"

experiment:
  name: "model-lab-replication-series"
  hypothesis: >
    A small Model-Lab replication series can exercise the AP-1 Lab-Control-Minimum
    validator and the AP-2 challenge-version validator against a real, opt-in
    activated run and decision, without producing any model-quality verdict,
    outcome upgrade, adoption, or promotion.
  status: testing
  category: workflow
  execution_status: executed
  evidence_level: experimental
  created: "2026-05-31"
  updated: "2026-06-19"
  author: "vibe-lab maintainers"
  triggered_by: "user-request-2026-06-06-run-003-semantic-rework"
  iteration: 10
  falsifiability:
    version: 1
    falsification_criterion: >
      The run would fail its purpose if the AP-1/AP-2 validators did not
      engage on the executed run_meta.json and decision.yml, if the repo-local
      execution artifacts were missing, or if the structure could only be
      satisfied by asserting a model-quality, outcome, adoption, or promotion
      claim.
    counter_hypotheses:
      - id: baseline_execution_is_oracle
        statement: >
          The executed baseline silently smuggles a comparative verdict (an oracle)
          instead of staying a single-run execution-evidence artifact.
        assessment:
          status: partially_checked
          outcome: inconclusive
          evidence_refs:
            - path: "results/evidence.jsonl"
            - path: "artifacts/run-001-rest-api-spec-first-baseline/execution.txt"
            - path: "artifacts/run-001-rest-api-spec-first-baseline/comparability.yml"
            - path: "artifacts/run-002-rest-api-code-first-control/comparability.yml"
            - path: "artifacts/run-003-rest-api-independent-model-or-tool-condition/condition-input.md"
            - path: "artifacts/run-003-rest-api-independent-model-or-tool-condition/comparability.yml"
          limitations:
            - "Three runs now executed under rest-api-v1; Run-003 adds a condition-gated third surface but no actual comparison is performed."
            - "Run-003 runtime validation is partial (separate runtime-evidence gate, validation_status: partial); comparability.yml in all runs must remain deferred, not automatic verdict."

  execution_refs:
    - "artifacts/run-001-rest-api-spec-first-baseline/run.yml"
    - "artifacts/run-001-rest-api-spec-first-baseline/execution.txt"
    - "artifacts/run-001-rest-api-spec-first-baseline/changed-files.txt"
    - "artifacts/run-001-rest-api-spec-first-baseline/timing.txt"
    - "artifacts/run-001-rest-api-spec-first-baseline/baseline-output.md"
    - "artifacts/run-002-rest-api-code-first-control/run.yml"
    - "artifacts/run-002-rest-api-code-first-control/execution.txt"
    - "artifacts/run-002-rest-api-code-first-control/changed-files.txt"
    - "artifacts/run-002-rest-api-code-first-control/timing.txt"
    - "artifacts/run-002-rest-api-code-first-control/control-output.md"
    - "artifacts/run-003-rest-api-independent-model-or-tool-condition/run.yml"
    - "artifacts/run-003-rest-api-independent-model-or-tool-condition/condition-input.md"
    - "artifacts/run-003-rest-api-independent-model-or-tool-condition/execution.txt"
    - "artifacts/run-003-rest-api-independent-model-or-tool-condition/changed-files.txt"
    - "artifacts/run-003-rest-api-independent-model-or-tool-condition/timing.txt"
    - "artifacts/run-003-rest-api-independent-model-or-tool-condition/run-output.md"
    - "artifacts/run-003-rest-api-independent-model-or-tool-condition/run_meta.json"
    - "artifacts/run-003-rest-api-independent-model-or-tool-condition/measurement.yml"
    - "artifacts/run-003-rest-api-independent-model-or-tool-condition/auditor-output.yml"
    - "artifacts/run-003-rest-api-independent-model-or-tool-condition/evidence-pack.yml"
    - "artifacts/run-003-rest-api-independent-model-or-tool-condition/static-verify-run-003.txt"
    - "results/evidence.jsonl"

  planning_refs:
    - "artifacts/run-003-plan-stronger-condition-contrast/plan.md"
    - "artifacts/run-003-plan-stronger-condition-contrast/changed-files.txt"
    - "results/condition-contrast-design-gate.yml"
  limitations:
    - "Run-003 execution surface exists; Run-003 runtime validation is partial (separate runtime-evidence gate, validation_status: partial); no result assessment is performed."
    - "Run-003 independence_status is self_reported_different_agent_tool_context; external_attestation is false, so model independence is not established."
    - "No result_assessment, model-quality verdict, comparative-superiority claim, adoption, promotion, production-readiness, security-readiness, or outcome upgrade is derived."

context:
  tools: ["model-lab-control-plane", "AP-1 model-lab-control validator", "AP-2 challenge-version validator"]
  language: "YAML/JSON"
  environment: "vibe-lab repository"

evidence:
  format: jsonl
  path: results/evidence.jsonl
