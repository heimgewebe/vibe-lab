      - "experiments/2026-05-31_model-lab-replication-series/results/cross-run-assessment.md"
    note: >
      Run-003's independent_model_or_tool_condition boundary remains
      self-reported. external_attestation=false.

  - id: "no_external_independent_auditor_comparison"
    status: "open"
    severity: "blocking"
    evidence:
      - "experiments/2026-05-31_model-lab-replication-series/results/cross-run-assessment.md"
    note: >
      No external or independent auditor comparison exists for the series.

allowed_claims:
  - "three_execution_surfaces_exist"
  - "run003_functional_runtime_checks_passed"
  - "run003_runtime_gate_status_partial"
  - "result_assessment_is_blocked"

