      functional runtime evidence is not invalidated by the dev-toolchain audit,
      while security-readiness, production-readiness, result_assessment, and
      comparison_ready remain blocked.

  - id: "weak_condition_contrast"
    status: "open"
    severity: "blocking"
    evidence:
      - "experiments/2026-05-31_model-lab-replication-series/results/cross-run-assessment.md"
    note: >
      Run-001 vs Run-002 condition contrast remains weak. The existing
      comparison surface is inconclusive and cannot support model-quality
