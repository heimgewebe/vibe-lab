  - "experiments/2026-05-31_model-lab-replication-series/artifacts/runtime-validation-run-003/runtime-evidence-gate.yml"
  - "experiments/2026-05-31_model-lab-replication-series/results/dependency-risk-caveat-scope.yml"
  # next-blocker-triage.yml is intentionally NOT listed as evidence here: the triage
  # derives from this readiness gate, so listing it back would make the evidence
  # chain circular. It stays referenced in next_actions (a signpost, not a foundation).

next_actions:
  - "Next recommended step (results/next-blocker-triage.yml): address weak_condition_contrast via a condition_contrast_design_gate before Run-004 or any formal assessment."
  - "Remediate dependency risk in a separate PR if security or production readiness is needed."
  - "Keep comparison_ready=false until blockers are closed. The triage prioritizes blockers; it does not unblock result assessment."
