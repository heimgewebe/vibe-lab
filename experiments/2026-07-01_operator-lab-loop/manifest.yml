schema_version: "0.1.0"

experiment:
  name: "operator-lab-loop"
  hypothesis: "A minimal operator lab loop can make real repo and PR work traceable without adding a new enforcement layer."
  status: testing
  category: workflow
  execution_status: executed
  execution_refs:
    - artifacts/run-001-plan-anchor/run_meta.json
    - artifacts/run-001-plan-anchor/run-card.yml
    - artifacts/run-001-plan-anchor/steuerboard-summary.json
    - artifacts/run-002-rlens-agent-ecosystem/run_meta.json
    - artifacts/run-002-rlens-agent-ecosystem/run-card.yml
    - artifacts/run-003-grabowski-patch-relay/run_meta.json
    - artifacts/run-003-grabowski-patch-relay/run-card.yml
    - artifacts/run-004-run-card-structure-hardening/run_meta.json
    - artifacts/run-004-run-card-structure-hardening/run-card.yml
    - artifacts/run-005-run-card-validator/run_meta.json
    - artifacts/run-005-run-card-validator/run-card.yml
    - artifacts/run-006-schauwerk-miro-quality-receipt/run_meta.json
    - artifacts/run-006-schauwerk-miro-quality-receipt/run-card.yml
    - artifacts/run-007-weltgewebe-dependency-alerts/run_meta.json
    - artifacts/run-007-weltgewebe-dependency-alerts/run-card.yml
    - artifacts/run-008-run004-runtime-candidate-preflight/run_meta.json
    - artifacts/run-008-run004-runtime-candidate-preflight/run-card.yml
    - results/evidence.jsonl
  created: "2026-07-01"
  updated: "2026-07-01"
  author: "heimgewebe"
  iteration: 1
  evidence_level: experimental
  falsifiability:
    version: 1
    falsification_criterion: >
      The loop is weakened if real repo runs show more added ceremony than
      reduced correction work, or if strong claims still lack bound evidence.
    counter_hypotheses:
      - id: ceremony_exceeds_signal
        statement: >
          Existing PR review, CI and operator judgement may already provide the
          useful signal, while the run card only adds overhead.
        assessment:
          status: partially_checked
          outcome: inconclusive
          evidence_refs:
            - path: "results/evidence.jsonl"
            - path: "results/result.md"
            - path: "artifacts/run-001-plan-anchor/run-card.yml"
          limitations:
            - "This anchor run only proves repo anchoring, not workflow benefit."
          confidence: low

context:
  tools:
    - ChatGPT
    - Grabowski
    - steuerboard
  language: "documentation"
  environment: "local vibe-lab checkout on heim-pc"

evidence:
  format: jsonl
  path: results/evidence.jsonl
