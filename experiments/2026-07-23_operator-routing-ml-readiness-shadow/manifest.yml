schema_version: "0.1.0"

experiment:
  name: "operator-routing-ml-readiness-shadow"
  hypothesis: >
    An evidence-bound shadow capture path can make naturally occurring operator
    routing cases suitable for offline model comparison without granting automatic
    routing, policy, queue, merge or runtime authority.
  status: designed
  category: workflow
  execution_status: prepared
  execution_refs: []
  created: "2026-07-23"
  updated: "2026-07-23"
  author: "Grabowski / Bureau"
  iteration: 1
  evidence_level: experimental
  falsifiability:
    version: 1
    falsification_criterion: >
      Below 80 percent direct route-plus-reviewed-outcome completeness fails the
      readiness gate. From 80.0 percent up to but below 90.0 percent is inconclusive
      and cannot authorize training. Also fail if more than 30 percent of
      non-abstaining outcomes lack primary evidence, if labels collapse process
      success into task correctness, or if capture requires raw private transcripts
      or automatic routing effects.
    counter_hypotheses:
      - id: "task_state_is_sufficient_label"
        statement: "Grabowski task terminal state is already a sufficient model-training outcome label."
        assessment:
          status: checked
          outcome: supports_primary
          pending_checks: []
          evidence_refs:
            - path: "experiments/2026-07-23_operator-routing-ml-readiness-shadow/artifacts/control-readiness.json"
          limitations:
            - "Task state establishes process lifecycle, not semantic task correctness or merge quality."
          confidence: high
      - id: "route_identity_is_already_complete"
        statement: "Current task records already carry complete canonical route identity for model training."
        assessment:
          status: checked
          outcome: supports_primary
          pending_checks: []
          evidence_refs:
            - path: "experiments/2026-07-23_operator-routing-ml-readiness-shadow/artifacts/control-readiness.json"
          limitations:
            - "Verified workspace route_evidence exists for a bounded subset, but current task rows expose no direct canonical route column or explicit join binding to reviewed semantic outcomes; argv inference is not canonical route evidence."
          confidence: high

context:
  tools:
    - "Grabowski task store and Agent Workspace manifest read-only audit"
    - "Chronik outcome evidence"
    - "Vibe-Lab deterministic experiment contracts"
    - "future offline scikit-learn baseline only after readiness gate"
  language: "Python, JSON, YAML and evidence-bound operator records"
  environment: "Natural Heimgewebe operator tasks; shadow-only observation; no productive mutation for experiment generation"

evidence:
  format: jsonl
  path: results/evidence.jsonl
