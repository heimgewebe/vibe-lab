schema_version: "0.1.0"

experiment:
  name: "outcome-bound-operator-loop-p0"
  hypothesis: >
    A frozen Outcome Case spec and a digest-bound append-only observation can
    separate intended outcome, technical closeout truth and reviewed outcome
    assessment without duplicating authority; the minimal form should remain the
    default unless a later matched comparison demonstrates material decision gain
    within the registered overhead and authority limits.
  status: inconclusive
  category: workflow
  execution_status: executed
  execution_refs:
    - "results/evidence.jsonl"
    - "p1/cohort-protocol.v1.yml"
    - "p1/activation.md"
    - "p1/decision.yml"
    - "p1/closeout.md"
    - "p1/cases/P1-01/stage-a-screening.yml"
    - "p1/cases/P1-01/full-spec.json"
    - "p1/cases/P1-01/form-outcome.yml"
    - "p1/cases/P1-01/trigger-provenance.yml"
    - "artifacts/run-p1-01-shadow-capture/run_meta.json"
    - "p1/cases/P1-02/stage-a-screening.yml"
    - "p1/cases/P1-02/full-spec.json"
    - "p1/cases/P1-02/form-outcome.yml"
    - "p1/cases/P1-02/trigger-provenance.yml"
    - "p1/cases/P1-02/eligibility-correction.yml"
    - "artifacts/run-p1-02-shadow-capture/run_meta.json"
  created: "2026-08-16"
  updated: "2026-08-16"
  author: "Vibe-Lab maintainers / Grabowski consumer"
  triggered_by: "conversation:user-request-2026-08-16-outcome-bound-operator-loop; github:heimgewebe/vibe-lab#332; codex-review:heimgewebe/vibe-lab#333; github:heimgewebe/vibe-lab#334; codex-review:heimgewebe/vibe-lab#335; github:heimgewebe/vibe-lab#337; grabowski-job:8e1b296f1a7b; github:heimgewebe/vibe-lab#338"
  iteration: 6
  evidence_level: experimental
  falsifiability:
    version: 1
    falsification_criterion: >
      Reject or defer the full-form escalation if six future matched natural
      cases yield fewer than two additional actionable decisions over the minimal
      form, if median full-form overhead exceeds twice minimal-form overhead or
      ten minutes, or if any case duplicates technical truth or grants Vibe-Lab
      routing, queue, policy, merge, deployment or runtime authority.
    counter_hypotheses:
      - id: "minimal_form_is_sufficient"
        statement: >
          Desired change and falsifier capture every actionable decision that the
          full form would add for the bounded natural cases.
        assessment:
          status: pending
          outcome: not_checked
          pending_checks:
            - "No P3 comparison is authorized by the early-stopped P1 cohort. Any future comparison requires a separately justified and authorized experiment."
          limitations:
            - "P1 stopped under its prospective-cohort protocol before a valid six-case sample existed; no minimal-versus-full efficacy evidence was produced."
          confidence: low
      - id: "full_form_ceremony_exceeds_signal"
        statement: >
          Full-form intake adds handling cost without enough additional
          decision-relevant information to justify escalation.
        assessment:
          status: partially_checked
          outcome: inconclusive
          evidence_refs:
            - path: "p1/cases/P1-01/form-outcome.yml"
              section: "form_attempt"
            - path: "p1/cases/P1-02/form-outcome.yml"
              section: "form_attempt"
            - path: "p1/cases/P1-02/eligibility-correction.yml"
              section: "finding"
          pending_checks:
            - "Do not infer ceremony efficacy from the early-stopped P1 cohort."
          limitations:
            - "P1-01 is the only preserved prospective normal shadow case. P1-02 is a permanently consumed stop-triggering capture whose original prospective classification is not endorsed after independent review."
            - "There is no minimal-form comparator and no completed six-case P1 cohort."
          confidence: low

context:
  tools:
    - "paper review"
    - "experiment-local JSON Schema Draft 2020-12"
    - "repository-owned registration and active-registry checks"
  language: "Markdown, JSON, YAML"
  environment: >
    Vibe-Lab experiment-only design surface; no productive integration

evidence:
  format: jsonl
  path: results/evidence.jsonl
