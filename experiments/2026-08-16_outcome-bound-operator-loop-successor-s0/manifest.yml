schema_version: "0.1.0"

experiment:
  name: "outcome-bound-operator-loop-successor-s0"
  hypothesis: >
    Prospective Outcome Case admission can be made semantically clearer by
    distinguishing antecedent productive state from the concrete
    intervention-under-test and requiring that the intervention identity is
    evidence-bound before its first productive effect, while failing closed on
    ambiguous or retrospectively relabeled cases.
  status: rejected
  category: workflow
  execution_status: executed
  execution_refs:
    - "artifacts/run-s0-independent-review/run_meta.json"
    - "results/evidence.jsonl"
    - "results/reviewer-b.md"
    - "results/s0-gate.md"
  created: "2026-08-16"
  updated: "2026-08-16"
  author: "ChatGPT / Grabowski"
  triggered_by: "conversation:user-request-2026-08-16-outcome-bound-successor-s0; github:heimgewebe/vibe-lab#339; review-task:9be9b949a14e493cb29f6d15"
  iteration: 2
  evidence_level: experimental
  falsifiability:
    version: 1
    falsification_criterion: >
      The S0 admission definition is not ready for a successor pilot if an
      independent semantic reviewer materially disagrees with any of the six
      fixed classifications, identifies a credible intervention-renaming escape,
      or if applying the definition requires productive authority or a new
      validation/control surface.
    counter_hypotheses:
      - id: "intervention_boundary_remains_ambiguous"
        statement: >
          Moving the boundary from any productive mutation to the named
          intervention merely relocates the ambiguity because reviewers can still
          disagree about which earlier acts belong to that intervention.
        assessment:
          status: checked
          outcome: supports_counterhypothesis
          evidence_refs:
            - path: "results/reviewer-b.md"
              section: "Material disagreements"
            - path: "results/evidence.jsonl"
          limitations:
            - "The rejection is bound to six fixed retrospective calibration cases and one independent semantic reviewer; it rejects this rule revision, not Outcome Cases generally."
          confidence: high
      - id: "indeterminate_fallback_avoids_false_precision"
        statement: >
          An explicit indeterminate status may resolve uncertain antecedent versus
          intervention boundaries without forcing a false eligible/ineligible
          classification or adding a validator.
        assessment:
          status: checked
          outcome: mixed
          evidence_refs:
            - path: "results/reviewer-b.md"
              section: "Independent classifications"
            - path: "results/evidence.jsonl"
          limitations:
            - "S0-04 shows the fallback can fail closed, but S0-03 shows that the frozen rule still allows the author to make an unsupported definitive classification before the fallback is reached."
          confidence: medium

context:
  tools:
    - "paper review"
    - "read-only Bureau candidate assessment"
    - "GitHub execution-source and review evidence"
    - "Grabowski isolated repository work lane"
  language: "Markdown, JSON, YAML"
  environment: >
    Vibe-Lab experiment-only design surface; no productive integration or
    successor natural cohort

evidence:
  format: jsonl
  path: results/evidence.jsonl