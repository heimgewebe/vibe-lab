rationale: >
  The frozen S0-R2 revision required zero material independent-review disagreement
  before it could justify even a separately reviewed natural admission-only shadow
  proposal. Exact-head GitHub review 4947056280 found that the written effect-lineage
  rule does not distinguish an earlier act that creates the exact object later
  preserved/mutated from an act that already produced a material sub-effect. That
  ambiguity directly affects the frozen eligible controls R2-02 and R2-08 and makes
  indeterminate a reasonable classification under the rule. The same review also
  found that the preregistered eight-pair S0/R2 comparison cannot be executed by the
  written R2-only reviewer procedure because rejected S0 contains only six fixed
  cases. The semantic finding alone rejects this rule revision; the comparison
  mismatch is a separate experiment-integrity defect. Frozen protocol, registration
  and author classifications are preserved rather than repaired after review.
