    The frozen S1 method defines the treatment sample as the first three canonical
    Bureau intakes or arrivals after activation, ordered by canonical Bureau event
    id, while also requiring a stable Bureau candidate/event identity. It does not
    define whether a post-activation supersession of a candidate identity that
    already existed before activation is itself a new intake/arrival for S1. Both
    event-arrival and first-new-candidate-identity interpretations therefore require
    an additional semantic choice not frozen at activation.
