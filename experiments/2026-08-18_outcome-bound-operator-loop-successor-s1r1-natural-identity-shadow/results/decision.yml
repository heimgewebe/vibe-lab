rationale: >
  S1-R1 never satisfied its pre-activation gate. Reviewer A found a material escape:
  the protocol did not freeze that natural treatment arrivals must be independently
  created outside the experiment, so a controller could manufacture three favourable
  post-activation candidates. A separate live Bureau readback found a second material
  defect: the frozen method groups history only by events containing an explicit
  candidate_id, while the deployed Bureau contract canonically assigns legacy events
  without stored IDs the identity candidate-event-<event_id>. That mismatch can hide
  an older identity root and misclassify later operator-intake enrichment as a new
  natural identity. Reviewer B reproduced U01-U13 but explicitly noted the naturalness
  assumption; its PASS cannot override valid material counterexamples. Both reviews
  were terminal before PR #348 was merged, so the later merge violated the frozen
  zero-material-finding merge gate and provides no activation authority. No natural
  S1-R1 slot was selected or consumed. The frozen method, registration and author cases
  are preserved rather than repaired in place.
