schema_version: "0.1.0"

experiment:
  name: "outcome-bound-operator-loop-successor-s1r2-paper"
  hypothesis: >
    A paper contract that canonicalizes every Bureau candidate event before identity
    grouping and treats natural-source independence as a fail-closed gate on an
    already fixed ordinal can close S1-R1's two material sampling defects without
    adding a production field, validator, service or post-observation selector.
  status: testing
  category: workflow
  execution_status: executed
  execution_refs:
    - "artifacts/run-s1r2-independent-reviews/run_meta.json"
    - "results/evidence.jsonl"
    - "results/reviewer-a2.md"
    - "results/reviewer-b2.md"
    - "results/controller-reconciliation-attestation.md"
    - "results/closeout-review.md"
    - "results/s1r2-gate.md"
    - "results/decision.yml"
  created: "2026-08-18"
  updated: "2026-08-19"
  author: "ChatGPT / Grabowski"
  triggered_by: "conversation:user-request-2026-08-18-continue-outcome-bound; conversation:user-request-2026-08-19-continue-outcome-bound; grabowski-job:1a00e6999ebc; grabowski-job:f2b7ea92892b; grabowski-job:3742d6127bc5; github:heimgewebe/vibe-lab#350"
  iteration: 3
  evidence_level: experimental
  falsifiability:
    version: 1
    falsification_criterion: >
      Reject the frozen author revision if either of two independent exact-head
      reviewers changes any P01-P18 disposition, finds a credible canonical-identity
      or source-independence escape, finds a way to filter a fixed ordinal after
      observation, requires a new production/control surface, or if the controller
      cannot reconcile every review job bound to the merge decision before merge.
    counter_hypotheses:
      - id: "canonical_identity_normalization_still_loses_legacy_roots"
        statement: >
          Normalizing each event before grouping may still allow a later explicit ID
          or intake-enrichment event to hide an older legacy root.
        assessment:
          status: checked
          outcome: supports_primary
          evidence_refs:
            - path: "results/reviewer-a2.md"
              section: "Adversarial findings"
            - path: "results/reviewer-b2.md"
              section: "Adversarial findings"
            - path: "results/s1r2-gate.md"
              section: "Gate result"
          limitations:
            - "Paper agreement does not establish future StateStore observability or natural-case feasibility."
          confidence: high
      - id: "naturalness_gate_becomes_selection_filter"
        statement: >
          Requiring source independence may let the observer skip inconvenient or
          ambiguous arrivals and cherry-pick later candidates.
        assessment:
          status: checked
          outcome: supports_primary
          evidence_refs:
            - path: "results/reviewer-a2.md"
              section: "Adversarial findings"
            - path: "results/reviewer-b2.md"
              section: "Adversarial findings"
            - path: "results/s1r2-gate.md"
              section: "Gate result"
          limitations:
            - "Paper review cannot establish that natural-source independence will be cheaply observable in live work."
          confidence: high
      - id: "review_reconciliation_still_allows_partial_read"
        statement: >
          A controller may still treat one PASS as sufficient while another exact-head
          decision-bound review is terminal but unread or materially rejects.
        assessment:
          status: checked
          outcome: supports_primary
          evidence_refs:
            - path: "artifacts/run-s1r2-independent-reviews/run_meta.json"
            - path: "results/controller-reconciliation-attestation.md"
              section: "Contemporaneous controller attestation"
            - path: "results/reviewer-a2.md"
              section: "Adversarial findings"
            - path: "results/reviewer-b2.md"
              section: "Adversarial findings"
            - path: "results/closeout-review.md"
              section: "P18 assessment"
            - path: "results/s1r2-gate.md"
              section: "Reviewer reconciliation"
          limitations:
            - "The historical controller reconciliation has no dedicated machine-generated semantic read receipt; it is attested contemporaneously and corroborated by immutable job, GitHub and Grabowski-audit evidence."
            - "The independent closeout reviewer judged a controller-verified hash-bound evidence packet rather than independently recollecting every primary file after several source-reading reviewer harnesses failed for infrastructure reasons."
            - "This experiment does not add or harden Grabowski merge-policy runtime."
          confidence: medium

context:
  tools:
    - "frozen S1-R1 rejection evidence"
    - "deployed Bureau canonical identity contract"
    - "Vibe-Lab experiment-only paper artifacts"
    - "two independent read-only exact-head reviews"
    - "receipt-bound Grabowski reviewer job archive"
    - "verified Grabowski audit chain and GitHub merge truth"
    - "independent semantic closeout review on a hash-bound primary-evidence packet"
  language: "Markdown, JSON, YAML"
  environment: "paper-gate execution only; no natural sampling or productive integration"

evidence:
  format: jsonl
  path: results/evidence.jsonl
