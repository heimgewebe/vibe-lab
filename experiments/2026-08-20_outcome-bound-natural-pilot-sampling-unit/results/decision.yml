  an already-fixed ordinal that is consumed rather than skipped. For the same post-A interfered
  birth, a protocol-conforming reader can therefore derive either zero units/slots from section 4
  or one consumed slot from section 7. That is exactly the slot-count ambiguity the experiment
  claimed to eliminate and it meets the preregistered harm/falsification threshold of 1. The Grok
  PASS remains valid historical evidence of reviewer disagreement, but it cannot override a later
  exact-head falsification. The frozen method and U01-U09 cases are deliberately not repaired in
  place because changing them after review would destroy the prospective test. Any corrected
  slot-before-interference construction must be a separate successor revision with fresh
  preregistration and exact-head review. No natural case was taken and no production authority is
  granted by this result.
