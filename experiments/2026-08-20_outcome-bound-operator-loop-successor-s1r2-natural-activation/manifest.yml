schema_version: "0.1.0"

experiment:
  name: "outcome-bound-operator-loop-successor-s1r2-natural-activation"
  hypothesis: >
    The terminally paper-passed S1-R2 canonical-identity and fixed-slot natural-source
    contract can bind the first three real post-activation Bureau Operator-Intake births
    prospectively, without source-selection, backfill, observer interference or material
    pre-mutation C/S/B/E/T/Q capture failure, while preserving the unchanged S0-R3 semantics.
  status: testing
  category: workflow
  execution_status: designed
  execution_refs: []
  created: "2026-08-20"
  updated: "2026-08-20"
  author: "ChatGPT / Grabowski"
  triggered_by: "conversation:user-request-2026-08-20-continue-outcome-bound; grabowski-job:25ed348f31f3; github:heimgewebe/vibe-lab#353:discussion_r3819276031; github:heimgewebe/vibe-lab#353:discussion_r3819467626"
  iteration: 4
  evidence_level: experimental
  falsifiability:
    version: 1
    falsification_criterion: >
      Reject before activation if the exact author base/head/canonical-PR-diff tuple fails
      independent activation-specific review, any decision-bound review remains unread or
      unreconciled, exactly one read-only activation-checkpoint job is not armed and bound before
      merge, pre-merge PR readback differs from that exact tuple, the resulting main merge commit
      does not have exactly the reviewed base and reviewed head as its two parents with a tree
      exactly equal to the reviewed-head tree, that same checkpoint job records any consecutive
      monotonic heartbeat gap above 5 seconds, cannot anchor its single authoritative Bureau SQLite
      journal snapshot in the closed 300-305 second post-integration window, or that snapshot fails
      or cannot freeze one immutable high-water event id, the job is restarted/replaced, an imported
      frozen authority is changed, or an activation/selection/authority degree of freedom remains.
      After activation, reject if any of the first three canonical Operator-Intake identity births
      strictly above the frozen activation watermark fails source independence, is skipped/replaced/
      backfilled, is captured only after productive mutation or result knowledge, cannot prospectively
      bind non-D0 C/S/B/E/T, produces a material terminal-review disagreement or authority effect, or
      if median capture effort exceeds 600 seconds. Cross-system wall-clock timestamps may never
      select, exclude, replace or reorder a slot.
    counter_hypotheses:
      - id: "natural_source_independence_is_not_reliably_observable"
        statement: >
          Genuine operator arrivals may lack enough pre-existing source evidence to prove the
          S1-R2 counterfactual without adding a production field or observer-caused metadata.
        assessment:
          status: pending
          outcome: not_checked
          pending_checks:
            - "Apply the frozen source-independence gate to S1R2-N01..N03 without mutating Bureau truth."
          limitations:
            - "The S1-R2 paper PASS established semantic stability, not live source-evidence availability."
          confidence: low
      - id: "prospective_capture_misses_natural_work"
        statement: >
          Even correctly fixed natural slots may be observed too late to freeze C/S/B/E/T/Q
          before productive mutation without delaying normal work.
        assessment:
          status: pending
          outcome: not_checked
          pending_checks:
            - "Measure capture timing and effort for every fixed slot; missed slots remain consumed."
          limitations:
            - "No natural slot exists before the pre-armed checkpoint preserves gap<=5s continuity, reaches the 300-305s snapshot window and freezes the Bureau event-id watermark."
          confidence: low
      - id: "three_fixed_slots_are_too_uninformative"
        statement: >
          A valid first-three sample may contain too many D0/not-applicable cases to establish
          natural handling feasibility even with zero integrity failures.
        assessment:
          status: pending
          outcome: not_checked
          pending_checks:
            - "Count definitive non-D0 complete bindings after all three fixed slots are consumed."
          limitations:
            - "INCONCLUSIVE rather than backfill is the preregistered outcome for this case."
          confidence: low

