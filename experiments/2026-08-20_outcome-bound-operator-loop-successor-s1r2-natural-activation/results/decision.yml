  clock, and then succeed on exactly one complete authoritative Bureau SQLite journal
  snapshot transaction that freezes one immutable high-water event id and snapshot
  receipt. A failed/restarted/replaced checkpoint job or later replacement snapshot
  cannot activate this revision. The first-three sequence is then defined
  deterministically from canonical Operator-Intake identity births whose
  identity-first event ids are strictly above that watermark, before naturalness.
  GitHub, local and Bureau wall-clock timestamps are descriptive evidence only and
  never decide cohort membership. No pre-watermark event may be reused or backfilled.
  No productive authority is created by this design revision. This file intentionally
  remains the prereview design snapshot: the eventual pre-activation review is
  external receipt-bound merge evidence and must not be committed back into the
  reviewed branch.
