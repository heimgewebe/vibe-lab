rationale: >
  This natural-activation revision never satisfied its pre-activation selection gate.
  The last frozen published author revision before the post-finding repair proposal is
  d299357c15457994583e93a8608c7366897e84aa on base
  5e49c38f522df43ca550ba0c908bec5d8a2c4418 with canonical PR diff SHA-256
  11b83b92bb17b8e213bee8e3db375921808eeb9e0cc24a5dbd51d462ff6aa4bf.
  Current-head Codex review found a material P1 pre-arming selection window: the
  protocol forbids work-informed timing only after the activation checkpoint is armed,
  but freezes no work-blind trigger or automatic non-selectable boundary between review,
  arming and merge. An independently planned Operator-Intake arrival can still satisfy
  S1-R2 source independence while a controller with advance timing knowledge changes
  whether that arrival falls below or above the eventual activation watermark by timing
  finalization, arming or merge. That can change S1R2-N01..N03 without changing the
  arrival itself. The preregistered falsification criterion rejects on any remaining
  activation/selection degree of freedom, so this revision is rejected before activation.
  A later unexecuted repair proposal using discussion_r3819573067 as an external trigger
  and a controller orchestration job is retained as historical design work only; it did
  not activate sampling and is not activation authority. Continuing to harden that
  proposal after the material finding would test a newly designed control mechanism
  rather than the prospective usability of the frozen natural successor. No natural
  slot, activation watermark or productive authority was created. This result refutes
  only this natural-activation revision; it does not refute S1-R2 canonical identity,
  S0-R3 Outcome Case semantics or any Minimal-versus-Full efficacy hypothesis.
