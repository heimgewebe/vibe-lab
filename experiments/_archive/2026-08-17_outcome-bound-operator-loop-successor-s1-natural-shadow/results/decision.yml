rationale: >
  The frozen S1 revision requires a deterministic first-three natural Bureau
  intake/arrival sequence and explicitly stops when that sample sequence cannot be
  proven. Independent exact-head review found that the later identity-first rule
  used to exclude post-activation events 8146-8148 was not shown to be frozen in
  the activation revision and cannot retroactively resolve already observed
  arrivals. Rereading the unchanged method confirms the root defect: it does not
  specify whether successive canonical events for one pre-existing candidate
  identity are separate S1 intakes/arrivals. Choosing either event-arrival or
  first-new-candidate semantics therefore completes the sampling contract after
  observation. The sample sequence is not provable from the frozen protocol. This
  is an integrity violation, so the preregistered gate requires
  REJECT_THIS_REVISION without selecting or backfilling a treatment cohort. The
  result rejects only this S1 sampling revision; it does not assess Outcome Case
  efficacy or Minimal-versus-Full superiority.
