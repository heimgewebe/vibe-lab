# Minimal result_assessment_readiness-shaped evidence for the fixture series. The
# condition-design validator reads artifact_type + series_id + challenge_version
# (identity), readiness_status / result_assessment_allowed / comparison_ready (blocked
# check), and blockers (target-open check). It does not schema-validate this file.
artifact_type: "result_assessment_readiness"
series_id: "fixture-series"
challenge_version: "rest-api-v1"
readiness_status: "blocked"
result_assessment_allowed: false
comparison_ready: false
blockers:
  - id: "weak_condition_contrast"
    status: "open"
  - id: "external_independence_not_attested"
    status: "open"
