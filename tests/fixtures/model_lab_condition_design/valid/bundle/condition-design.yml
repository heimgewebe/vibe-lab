schema_version: v1
artifact_type: model_lab_condition_design
triggered_by: tests/fixtures/model_lab_condition_design
design_id: fixture-condition-design
design_status: frozen
design_artifact_path: tests/fixtures/model_lab_condition_design/valid/bundle/condition-design.yml
series_id: fixture-series
challenge_version: rest-api-v1
challenge:
  id: rest-api
  version: rest-api-v1
target_blocker: weak_condition_contrast
target_blocker_status_after_design: open
precondition_snapshot_ref: tests/fixtures/model_lab_condition_design/valid/bundle/precondition-snapshot.yml
workflow_instruction_source_ref: tests/fixtures/model_lab_condition_design/valid/bundle/workflow-instruction-protocol.yml
primary_intervention_axis:
  id: workflow_protocol
  semantics: assigned_instruction_requirement
  selection_status: selected
  required_axis_count: 1
arms:
- id: control
  role: control
  workflow_protocol: direct_implementation
  overlay_ref: tests/fixtures/model_lab_condition_design/valid/bundle/control-workflow-protocol.md
- id: treatment
  role: treatment
  workflow_protocol: spec_first
  overlay_ref: tests/fixtures/model_lab_condition_design/valid/bundle/treatment-workflow-protocol.md
  derived_from:
    snapshot_ref: tests/fixtures/model_lab_condition_design/valid/bundle/source-snapshots/spec-first.snapshot
condition_input_assembly:
  normalization:
    encoding: utf-8
    line_endings: lf
    final_newline: required
  components:
    benchmark:
      ref: tests/fixtures/model_lab_condition_design/valid/bundle/source-snapshots/rest-api-v1.snapshot
    shared_condition:
      ref: tests/fixtures/model_lab_condition_design/valid/bundle/common-condition.md
  arms:
    control:
      overlay_ref: tests/fixtures/model_lab_condition_design/valid/bundle/control-workflow-protocol.md
      composition_order:
      - benchmark
      - shared_condition
      - arm_overlay
    treatment:
      overlay_ref: tests/fixtures/model_lab_condition_design/valid/bundle/treatment-workflow-protocol.md
      composition_order:
      - benchmark
      - shared_condition
      - arm_overlay
condition_input_claim: same_benchmark_and_shared_context_differ_only_in_workflow_overlay
condition_compliance_requirements:
  control:
    specification_requirement_present: false
  treatment:
    specification_requirement_present: true
    specification_complete_before_first_implementation_mutation: true
  required_future_evidence:
  - specification_artifact_ref
  - specification_completeness_verdict
  - first_implementation_mutation_evidence
  - ordering_verdict
  - protocol_assignment_compliance
  - contamination_status
artifact_surfaces:
  common_outcome_artifacts:
  - implementation
  - shared_verification_evidence
  - shared_measurement_evidence
  required_future_process_evidence:
  - protocol_assignment_compliance
  - contamination_status
  - ordering_verdict
  arm_specific_process_artifacts:
    control: []
    treatment:
    - preimplementation_specification
process_artifacts_scored_as_outcome: false
prompt_scope:
  primary_axis_is_bundled_workflow_instruction_protocol: true
  difference_not_attributable_to_ordering_length_structure_alone: true
  held_constant_across_arms:
  - outer_structure
  - language
  - tone
  - quality_rhetoric
  - motivation
  - examples
  - tool_hints
  - permissions
controlled_dimensions:
- id: challenge_contract
  control_method: identical_shared_challenge
  binding_status: bound_at_design
  binding_source: condition_input_assembly.components.benchmark (frozen rest-api-v1
    snapshot)
  same_value_across_arms_required: true
  blocking_divergence: A different challenge or challenge_version between arms invalidates
    the design.
- id: acceptance_surface
  control_method: identical_shared_acceptance
  binding_status: bound_at_design
  binding_source: common-condition.md
  same_value_across_arms_required: true
  blocking_divergence: Different acceptance criteria between arms break comparability.
- id: evaluation_criteria
  control_method: identical_shared_evaluation
  binding_status: bound_at_design
  binding_source: measurement-protocol.yml
  same_value_across_arms_required: true
  blocking_divergence: Different evaluation criteria between arms break comparability.
- id: verification_surface
  control_method: identical_shared_verification
  binding_status: bound_at_design
  binding_source: verification-protocol.yml
  same_value_across_arms_required: true
  blocking_divergence: Different verification surfaces between arms break comparability.
- id: evidence_capture
  control_method: identical_shared_capture
  binding_status: bound_at_design
  binding_source: common-condition.md + verification-protocol.yml
  same_value_across_arms_required: true
  blocking_divergence: Different evidence capture between arms breaks comparability.
- id: model_identity_and_version
  control_method: hold_constant_single_source
  binding_status: deferred_to_execution_readiness
  binding_source: single shared execution-readiness binding
  same_value_across_arms_required: true
  blocking_divergence: Different model identity/version between arms invalidates the
    design.
- id: tool_and_agent_mode
  control_method: hold_constant_single_source
  binding_status: deferred_to_execution_readiness
  binding_source: single shared execution-readiness binding
  same_value_across_arms_required: true
  blocking_divergence: Different tooling/agent mode/permissions between arms invalidates
    the design.
- id: sampling_configuration
  control_method: hold_constant_single_source
  binding_status: deferred_to_execution_readiness
  binding_source: single shared execution-readiness binding
  same_value_across_arms_required: true
  blocking_divergence: Different sampling configuration between arms invalidates the
    design.
- id: human_intervention
  control_method: equivalent_surface
  binding_status: deferred_to_execution_readiness
  binding_source: human_intervention block (same across arms, asymmetric forbidden)
  same_value_across_arms_required: true
  blocking_divergence: Unequal human intervention between arms confounds the contrast.
- id: dependency_and_runtime_environment
  control_method: hold_constant_single_source
  binding_status: deferred_to_execution_readiness
  binding_source: single shared execution-readiness binding
  same_value_across_arms_required: true
  blocking_divergence: Different dependency/runtime environment between arms invalidates
    the design.
- id: test_harness
  control_method: equivalent_surface
  binding_status: deferred_to_execution_readiness
  binding_source: verification-protocol.yml (shared harness binding deferred but identical)
  same_value_across_arms_required: true
  blocking_divergence: Different test harness between arms manufactures false contrast.
- id: session_isolation
  control_method: separate_fresh_session_per_arm
  binding_status: deferred_to_execution_readiness
  binding_source: execution_readiness_requirements
  same_value_across_arms_required: true
  blocking_divergence: Shared conversation context across arms leaks treatment into
    control.
- id: prompt_scope_neutrality
  control_method: rendered_from_single_structured_source
  binding_status: bound_at_design
  binding_source: workflow-instruction-protocol.yml shared_instruction_surface
  same_value_across_arms_required: true
  blocking_divergence: Differing tone/structure/examples beyond the Spec-First requirement
    adds a second axis.
confounder_controls:
- id: multi_axis_drift
  controlled_by: Exactly one primary axis (workflow_protocol); every other dimension
    is a controlled binding.
  effect_if_uncontrolled: blocks_design
- id: acceptance_or_test_drift
  controlled_by: Shared frozen benchmark, common-condition, and verification-protocol.
  effect_if_uncontrolled: blocks_design
- id: unequal_human_intervention
  controlled_by: 'human_intervention block: same across arms, asymmetric intervention
    forbidden.'
  effect_if_uncontrolled: blocks_design
- id: dependency_or_runtime_drift
  controlled_by: Runtime values bound from a single shared execution-readiness source.
  effect_if_uncontrolled: must_be_reported
- id: post_hoc_condition_rework
  controlled_by: All design + source artifacts frozen before execution via the SHA-256
    freeze manifest.
  effect_if_uncontrolled: blocks_design
- id: self_reported_independence_as_external_proof
  controlled_by: External attestation kept as a separate later evidence track; not
    claimed here.
  effect_if_uncontrolled: must_be_reported
- id: prompt_scope_confound
  controlled_by: Overlays rendered from one structured source; shared surface identical,
    only spec differs.
  effect_if_uncontrolled: must_be_reported
human_intervention:
  same_across_arms_required: true
  binding_status: deferred_to_execution_readiness
  asymmetric_intervention_forbidden: true
verification_surface:
  binding_status: bound_at_design
  protocol_ref: tests/fixtures/model_lab_condition_design/valid/bundle/verification-protocol.yml
executable_harness_instance:
  binding_status: deferred_to_execution_readiness
measurement_surface:
  binding_status: bound_at_design
  protocol_ref: tests/fixtures/model_lab_condition_design/valid/bundle/measurement-protocol.yml
execution_readiness_requirements:
  same_repository_commit_across_arms: true
  clean_start_state_required: true
  separate_worktree_per_arm: true
  fresh_session_per_arm: true
  shared_conversation_context_forbidden: true
  cross_arm_artifact_reuse_forbidden: true
  treatment_spec_reuse_by_control_forbidden: true
  execution_order_must_be_declared: true
materiality_rationale: 'The contrast is material and observable before execution,
  grounded in pre-execution process rules: the control arm carries no assigned upfront-specification
  requirement and may begin implementation immediately, whereas the treatment arm
  is assigned a Spec-First requirement and may not implement before a complete, completeness-checked
  structured specification exists. The assigned-instruction difference is objectively
  distinguishable before any run, and both arm overlays are rendered from a single
  structured source so only this axis differs. No effect, superiority, or quality
  claim is made; a single later paired execution would not establish a condition effect.'
condition_semantics_status: frozen
design_constraints_frozen: true
execution_binding_status: pending
runtime_values_bound: false
run_004_execution_allowed: false
result_assessment_allowed_after_design: false
comparison_ready_after_design: false
summary: An assigned workflow-instruction axis (Spec-First present vs absent) and
  two future arms (control=direct_implementation, treatment=spec_first) are selected,
  controlled, and frozen before execution for the open weak_condition_contrast blocker,
  bound to immutable source byte-snapshots with verified provenance. Runtime values
  are unbound; nothing is executed, measured, or assessed.
source_evidence:
- path: tests/fixtures/model_lab_condition_design/_evidence/assessment-context.txt
  kind: assessment_context
- path: tests/fixtures/model_lab_condition_design/_evidence/method-context.txt
  kind: method_context
freeze:
  frozen_before_execution: true
  freeze_manifest_ref: tests/fixtures/model_lab_condition_design/valid/bundle/freeze-manifest.yml
decision:
  status: frozen
  next_step: run_004_execution_readiness_may_be_assessed
  reason: The assigned-instruction contrast is selected and frozen before execution
    against verified immutable sources. The only permitted next step is a separate
    execution-readiness / authorization check that binds the deferred runtime values
    identically across arms and declares execution order; this design does not execute,
    bind runtime, or authorize assessment.
does_not_establish:
- weak_condition_contrast_resolved
- run_004_execution_allowed
- run_004_executed
- execution_environment_bound
- result_assessment_allowed
- comparison_ready
- condition_effect
- model_quality
- comparative_superiority
- external_model_independence
- external_auditor_comparison_completed
- dependency_risk_remediated
- security_readiness
- production_readiness
- single_paired_execution_establishes_condition_effect
