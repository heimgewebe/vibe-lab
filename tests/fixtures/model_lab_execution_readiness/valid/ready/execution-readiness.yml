  - id: human_intervention_count
    rule: Count every human-originated message after task delivery, including predefined infrastructure responses.
  - id: workflow_protocol_compliance
    rule: Treatment requires a complete specification before first implementation mutation; control voluntary specification
      is not automatically non-compliant.
  - id: contamination_status
    rule: Mark contaminated if an arm sees the other payload, role labels, hypothesis, other-arm artifacts, or reconstructable
      experiment metadata.
  - id: functional_test_pass_ratio
    rule: passing_shared_functional_tests / total_shared_functional_tests; missing values remain null.
  - id: error_case_test_pass_ratio
    rule: passing_shared_error_case_tests / total_shared_error_case_tests; missing values remain null.
  - id: forced_500_check_pass
    rule: True only if the shared framework-neutral forced-500 assertion passes.
  - id: timeout_count
    rule: Count predeclared timeout events; never convert timeout to zero pass.
  - id: abort_status
    rule: Record any arm abort explicitly and block comparison.
  - id: retry_count
    rule: Count every predeclared retry; silent or one-sided retry is invalid.
