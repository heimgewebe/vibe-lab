  agent_abort_behavior: record abort; do not silently restart one arm
  install_failure_behavior: record failure; do not patch dependencies inside this
    readiness contract
  timeout_behavior: record timeout; do not extend timeout post hoc
  flaky_test_behavior: no unilateral rerun; both arms require the same predeclared
    retry policy
  both_arms_restart_after_retry: true
  silent_or_one_sided_retries_forbidden: true
