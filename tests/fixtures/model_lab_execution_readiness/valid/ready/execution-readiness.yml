metric_operationalization:
  binding_status: bound
  metrics:
  - id: functional_test_pass_ratio
    rule: passing_shared_functional_tests / total_shared_functional_tests
  - id: error_case_test_pass_ratio
    rule: passing_shared_error_case_tests / total_shared_error_case_tests
  - id: forced_500_check_pass
    rule: 1 if the shared forced-500 assertion passes else 0
  - id: workflow_protocol_compliance
    rule: assigned-protocol compliance verdict (compliant / non_compliant / contaminated);
      not a quality judgment
  - id: time_to_validated_change_seconds
    rule: timer_end - timer_start
  - id: time_to_stop_seconds
    rule: timer_end - timer_start
  - id: rework_steps
    rule: number of post-authoring revisions to fix defects in already-produced implementation
  - id: human_intervention_count
    rule: number of human-originated corrections beyond the shared task input
  - id: scope_drift_status
    rule: none / observed (challenge or acceptance surface changed by the arm)
  - id: contamination_status
    rule: none / prompt_metadata_exposure / other_arm_artifact_exposure / shared_context_exposure
      / operator_intervention / workspace_seed_drift / unknown
  - id: timeout_count
    rule: number of predeclared timeout events; never impute a timeout as zero or
      success
  - id: abort_status
    rule: completed / aborted; any abort blocks comparison and preserves incomplete
      metrics as null
  - id: retry_count
    rule: number of predeclared symmetric retries; silent or one-sided retries are
      invalid
