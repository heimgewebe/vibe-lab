schema_version: "v1"
artifact_type: "result_assessment_readiness"
series_id: "fixture-series"
challenge_version: "rest-api-v1"

# Invalid: readiness_status=blocked but no blocker has status=open.
# Expected rule: BLOCKED_REQUIRES_OPEN_BLOCKER
readiness_status: "blocked"
result_assessment_allowed: false
comparison_ready: false

blockers:
  - id: "already_resolved_blocker"
    status: "resolved"
    severity: "non_blocking"
    evidence:
      - "tests/fixtures/result_assessment_readiness/_evidence/assessment-note.txt"

allowed_claims:
  - "result_assessment_is_blocked"

disallowed_claims:
  - "model_quality"
  - "comparative_superiority"
  - "condition_effect"
  - "outcome_upgrade"
  - "adoption_readiness"
  - "promotion_readiness"
  - "production_readiness"
  - "security_readiness"
  - "absence_of_regressions"
  - "external_model_independence"

evidence:
  - "tests/fixtures/result_assessment_readiness/_evidence/assessment-note.txt"

next_actions:
  - "Record at least one open blocker, or change readiness_status."
