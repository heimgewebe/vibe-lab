schema_version: "v1"
artifact_type: "result_assessment_readiness"
series_id: "fixture-series"
challenge_version: "rest-api-v1"

# Invalid: comparison_ready=true while readiness is not ready + result_assessment_allowed.
# Expected rule: COMPARISON_READY_REQUIRES_ASSESSMENT_ALLOWED
readiness_status: "not_applicable"
result_assessment_allowed: false
comparison_ready: true

blockers: []

allowed_claims:
  - "result_assessment_is_allowed"

disallowed_claims:
  - "model_quality"
  - "comparative_superiority"
  - "condition_effect"
  - "outcome_upgrade"
  - "adoption_readiness"
  - "promotion_readiness"
  - "production_readiness"
  - "security_readiness"
  - "absence_of_regressions"
  - "external_model_independence"

evidence:
  - "tests/fixtures/result_assessment_readiness/_evidence/assessment-note.txt"

next_actions:
  - "Only set comparison_ready=true once readiness_status=ready and assessment is allowed."
